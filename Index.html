<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title><?= mode === 'stocktake' ? '覺風格位拍照批次盤點' : '零庫存前置物資建檔' ?></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .badge-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .badge {
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .badge.green {
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    h2 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p.desc {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .dual-photo-grid {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .photo-slot {
      flex: 1;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      padding: 12px 6px;
      text-align: center;
      background: #f8fafc;
      cursor: pointer;
      position: relative;
    }
    .photo-slot.active {
      border-color: #16a34a;
      background: #f0fdf4;
    }
    .photo-slot-icon { font-size: 1.8rem; margin-bottom: 4px; }
    .photo-slot-title { font-size: 0.85rem; font-weight: bold; color: #0f172a; }
    .photo-slot-sub { font-size: 0.72rem; color: #64748b; margin-top: 2px; }
    .slot-preview {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }

    .camera-trigger {
      display: block;
      width: 100%;
      background-color: #16a34a;
      color: #ffffff;
      text-align: center;
      padding: 14px 0;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.25);
    }

    #previewImg {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
      display: none;
      background-color: #000000;
    }

    .status-box {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .status-box.loading { display: block; background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .status-box.success { display: block; background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .status-box.error { display: block; background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    /* 批次盤點卡片樣式 */
    .item-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .item-card.checked {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }
    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .item-header input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 4px;
      accent-color: #16a34a;
    }

    .item-thumb {
      width: 52px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      flex-shrink: 0;
      background-color: #f1f5f9;
      cursor: pointer;
    }

    .item-info { flex: 1; }
    .item-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
    }
    .item-sub {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 3px;
    }

    /* 🌟 卡片快捷輔助按鈕工具列 */
    .card-tools {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .tool-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #475569;
      padding: 4px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .tool-btn:hover {
      background: #e2e8f0;
    }
    .tool-btn.blue {
      border-color: #93c5fd;
      color: #0284c7;
      background: #f0f9ff;
    }

    .candidates-box {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
    }
    .candidate-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      color: #334155;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .qty-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .qty-stepper { display: flex; align-items: center; gap: 4px; }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
    }
    .qty-input {
      width: 48px;
      height: 32px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .quick-pills { display: flex; gap: 4px; }
    .pill {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .batch-submit-btn {
      width: 100%;
      background: #16a34a;
      color: #fff;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
    }
    .batch-submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }
    .close-btn {
      width: 100%;
      background: #f1f5f9;
      color: #475569;
      padding: 12px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    label.field-lbl {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
    }

    /* 🌟 微調搜尋互動彈窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .search-result-list {
      max-height: 220px;
      overflow-y: auto;
      margin: 10px 0;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }
    .search-result-item:hover {
      background: #f0fdf4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge-bar">
      <span class="badge green" id="badgeMode">📸 拍照盤點模式</span>
      <span class="badge" id="badgeLoc">格位: --</span>
      <span class="badge" id="badgeUser">志工: --</span>
    </div>

    <h2 id="mainHeading">📸 格位拍照批次盤點</h2>
    <p class="desc" id="mainDesc">請拍照比對物資，支援一圖多本，免開鍵盤打字！</p>

    <img id="previewImg" alt="預覽圖">
    <div id="statusBox" class="status-box"></div>

    <!-- 盤點模式 -->
    <div id="stocktakeSection" style="display:none;">
      <label class="camera-trigger" for="cameraStocktakeFile">📷 開啟相機 拍攝架上物資</label>
      <input type="file" id="cameraStocktakeFile" style="display:none;" accept="image/*" capture="environment">

      <!-- 專屬單書補拍版權頁相機 -->
      <input type="file" id="cameraSingleCipFile" style="display:none;" accept="image/*" capture="environment">

      <div id="itemsContainer"></div>
      <button id="batchSubmitBtn" class="batch-submit-btn" style="display:none;" onclick="submitBatchStocktake()">💾 確認並寫入庫存 (0 件)</button>
      <button id="btnContinueNext" class="close-btn" style="display:none;" onclick="continueNextBatch()">🔄 拍本格下一批物資</button>
    </div>

    <!-- 建檔模式 -->
    <div id="inboundSection" style="display:none;">
      <div class="dual-photo-grid">
        <label class="photo-slot" id="slotCover" for="cameraCoverFile">
          <div class="photo-slot-icon">📸</div>
          <div class="photo-slot-title">1. 拍攝封面 (必填)</div>
          <div class="photo-slot-sub">供盤點外觀比對</div>
          <img id="previewCover" class="slot-preview" alt="封面預覽">
        </label>
        <input type="file" id="cameraCoverFile" style="display:none;" accept="image/*" capture="environment">

        <label class="photo-slot" id="slotInner" for="cameraInnerFile">
          <div class="photo-slot-icon">📖</div>
          <div class="photo-slot-title">2. 拍版權頁 (選填)</div>
          <div class="photo-slot-sub">解析 CIP 標準書名</div>
          <img id="previewInner" class="slot-preview" alt="版權頁預覽">
        </label>
        <input type="file" id="cameraInnerFile" style="display:none;" accept="image/*" capture="environment">
      </div>

      <button id="btnTriggerDualAnalyze" class="batch-submit-btn" style="display:none; margin-bottom:12px;" onclick="triggerDualAnalyze()">
        🚀 開始 AI 雙照比對辨識
      </button>

      <div id="inboundFormFields" style="display:none;">
        <label class="field-lbl" for="itemName">物資品名 / 書名：</label>
        <input type="text" id="itemName" placeholder="AI 自動帶入，可手動修正">

        <label class="field-lbl" for="itemAuthor">作者 / 著者：</label>
        <input type="text" id="itemAuthor" placeholder="作者姓名">

        <label class="field-lbl" for="categorySelect">物資大類：</label>
        <select id="categorySelect"><option value="">載入中...</option></select>

        <label class="field-lbl" for="barcode">ISBN / 條碼：</label>
        <input type="text" id="barcode" placeholder="選填">
        
        <input type="hidden" id="uploadedCoverUrl">
        <input type="hidden" id="uploadedInnerUrl">

        <button id="inboundSubmitBtn" class="batch-submit-btn" onclick="submitInboundSku()">💾 確認並建立物資主檔</button>
      </div>
    </div>
  </div>

  <!-- 🌟 微調搜尋 Modal 視窗 -->
  <div id="searchModal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="font-size:1.1rem; margin-bottom:8px;">🔍 手動微調搜尋主檔</h3>
      <p style="font-size:0.8rem; color:#64748b; margin-bottom:10px;">可輸入書名關鍵字、作者或副標題：</p>
      <div style="display:flex; gap:6px;">
        <input type="text" id="modalSearchInput" placeholder="例：寂靜道、法命">
        <button type="button" class="tool-btn blue" style="padding:0 14px; font-weight:bold;" onclick="executeModalSearch()">搜尋</button>
      </div>
      <div id="modalSearchResult" class="search-result-list"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
        <button type="button" class="tool-btn" onclick="closeSearchModal()">取消關閉</button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const PAGE_MODE = urlParams.get('mode') || "<?= mode ?>" || "inbound";
    const CELL_CODE = urlParams.get('cell') || "<?= cell ?>" || "";
    const USER_ID = urlParams.get('uid') || "<?= uid ?>" || "";
    const USER_NAME = urlParams.get('name') || "<?= userName ?>" || "";
    const SHELF_NAME = urlParams.get('shelf') || "<?= shelf ?>" || "";

    let recognizedItemList = [];
    let coverBase64Data = null;
    let innerBase64Data = null;
    let activeCardIndex = null;

    window.addEventListener('DOMContentLoaded', () => {
      if (PAGE_MODE === 'stocktake') {
        document.getElementById('badgeMode').innerText = '📸 格位批次盤點';
        document.getElementById('badgeLoc').innerText = `📍 ${SHELF_NAME || CELL_CODE || '未定格位'}`;
        document.getElementById('badgeUser').innerText = `👤 ${USER_NAME || '志工'}`;
        document.getElementById('mainHeading').innerText = `📸 盤點：${SHELF_NAME || '層架'}`;
        document.getElementById('mainDesc').innerText = '一圖可同時辨識多本物資，確認數量後一鍵送出！';
        document.getElementById('stocktakeSection').style.display = 'block';
      } else {
        document.getElementById('badgeMode').innerText = '📦 零庫存主檔建檔';
        document.getElementById('badgeLoc').style.display = 'none';
        document.getElementById('badgeUser').style.display = 'none';
        document.getElementById('mainHeading').innerText = '📸 零庫存前置物資建檔';
        document.getElementById('mainDesc').innerText = '拍攝封面（供盤點識別）與版權頁（供CIP解析），雙照精準建檔。';
        document.getElementById('inboundSection').style.display = 'block';
        loadCategoryDropdown();
      }
    });

    // ==================== 建檔模式事件處理 ====================
    document.getElementById('cameraCoverFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const preview = document.getElementById('previewCover');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      document.getElementById('slotCover').classList.add('active');

      compressAndConvertToBase64(file, (base64) => {
        coverBase64Data = base64;
        checkCanAnalyzeInbound();
      });
    });

    document.getElementById('cameraInnerFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const preview = document.getElementById('previewInner');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      document.getElementById('slotInner').classList.add('active');

      compressAndConvertToBase64(file, (base64) => {
        innerBase64Data = base64;
        checkCanAnalyzeInbound();
      });
    });

    function checkCanAnalyzeInbound() {
      if (coverBase64Data || innerBase64Data) {
        document.getElementById('btnTriggerDualAnalyze').style.display = 'block';
      }
    }

    function triggerDualAnalyze() {
      const statusBox = document.getElementById('statusBox');
      const btn = document.getElementById('btnTriggerDualAnalyze');
      btn.disabled = true;

      statusBox.className = 'status-box loading';
      statusBox.innerHTML = '⏳ 正在上傳並交由 Gemini AI 比對【封面】與【版權頁】，請稍候約 1~2 秒...';

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          if (!res.success) {
            statusBox.className = 'status-box error';
            statusBox.innerHTML = `⚠️ 辨識提示：${res.message || '辨識未完全'}，請手動輸入。`;
          } else {
            statusBox.className = 'status-box success';
            statusBox.innerHTML = '✅ AI 雙照比對辨識完成！請核對資訊後建立主檔：';
            document.getElementById('itemName').value = res.recognizedName || '';
            document.getElementById('itemAuthor').value = res.author || '';
            document.getElementById('barcode').value = res.barcode || '';
            document.getElementById('uploadedCoverUrl').value = res.imageUrl || '';
            document.getElementById('uploadedInnerUrl').value = res.innerImageUrl || '';

            if (res.category) {
              const sel = document.getElementById('categorySelect');
              for (let i = 0; i < sel.options.length; i++) {
                if (sel.options[i].value === res.category || sel.options[i].text.includes(res.category)) {
                  sel.selectedIndex = i;
                  break;
                }
              }
            }
          }
          document.getElementById('inboundFormFields').style.display = 'block';
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          statusBox.className = 'status-box error';
          statusBox.innerHTML = `❌ 連線異常：${err.message || err}`;
          document.getElementById('inboundFormFields').style.display = 'block';
        })
        .uploadAndAnalyzeDualImages(coverBase64Data, innerBase64Data, 'image/jpeg');
    }

    function submitInboundSku() {
      const name = document.getElementById('itemName').value.trim();
      const author = document.getElementById('itemAuthor').value.trim();
      const cat = document.getElementById('categorySelect').value;
      const barcode = document.getElementById('barcode').value.trim();
      const coverUrl = document.getElementById('uploadedCoverUrl').value;
      const innerUrl = document.getElementById('uploadedInnerUrl').value;

      if (!name) return alert("請輸入品名！");
      if (!cat) return alert("請選擇大類！");

      const btn = document.getElementById('inboundSubmitBtn');
      btn.disabled = true;
      btn.innerText = '⏳ 正在寫入主檔...';

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerText = '💾 確認並建立物資主檔';
          const sb = document.getElementById('statusBox');
          if (res.success) {
            sb.className = 'status-box success';
            sb.innerHTML = `🎉 ${res.message}<br>您可繼續拍攝下一件物資。`;
            document.getElementById('itemName').value = '';
            document.getElementById('itemAuthor').value = '';
            document.getElementById('barcode').value = '';
            document.getElementById('uploadedCoverUrl').value = '';
            document.getElementById('uploadedInnerUrl').value = '';
            document.getElementById('previewCover').style.display = 'none';
            document.getElementById('previewInner').style.display = 'none';
            document.getElementById('slotCover').classList.remove('active');
            document.getElementById('slotInner').classList.remove('active');
            document.getElementById('btnTriggerDualAnalyze').style.display = 'none';
            document.getElementById('inboundFormFields').style.display = 'none';
            coverBase64Data = null;
            innerBase64Data = null;
          } else {
            sb.className = 'status-box error';
            sb.innerHTML = `❌ 錯誤：${res.message}`;
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = '💾 確認並建立物資主檔';
          alert("連線錯誤: " + err.message);
        })
        .createSkuMasterItem({
          itemName: name,
          author: author,
          category: cat,
          barcode: barcode,
          imageUrl: coverUrl,
          innerImageUrl: innerUrl
        });
    }

    function loadCategoryDropdown() {
      google.script.run.withSuccessHandler(list => {
        const sel = document.getElementById('categorySelect');
        sel.innerHTML = '<option value="">-- 請選擇大類 --</option>';
        (list || []).forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = `${c.name} (${c.code})`;
          sel.appendChild(opt);
        });
      }).getCategoryList();
    }

    // ==================== 盤點模式事件處理 ====================
    document.getElementById('cameraStocktakeFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const preview = document.getElementById('previewImg');
      const statusBox = document.getElementById('statusBox');

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';

      statusBox.className = 'status-box loading';
      statusBox.innerHTML = '⏳ 正在調用 Gemini AI 辨識架上物資，請稍候約 1~2 秒...';

      compressAndConvertToBase64(file, (base64Data, mimeType) => {
        google.script.run
          .withSuccessHandler(handleStocktakeVisionSuccess)
          .withFailureHandler(handleVisionError)
          .analyzeStocktakePhoto(base64Data, mimeType);
      });
    });

    function handleStocktakeVisionSuccess(res) {
      const statusBox = document.getElementById('statusBox');
      const container = document.getElementById('itemsContainer');
      const submitBtn = document.getElementById('batchSubmitBtn');
      const nextBtn = document.getElementById('btnContinueNext');

      if (!res.success || !res.items || res.items.length === 0) {
        statusBox.className = 'status-box error';
        statusBox.innerHTML = '⚠️ 未能在畫面中辨識出清楚物資，請嘗試抽出一本靠近重新拍攝。';
        return;
      }

      recognizedItemList = res.items;
      statusBox.className = 'status-box success';
      statusBox.innerHTML = `✅ 已辨識出 ${res.items.length} 件物資！請核對封面與數量後送出：`;
      container.innerHTML = '';

      res.items.forEach((item, index) => {
        const itemCard = document.createElement('div');
        itemCard.className = 'item-card checked';
        itemCard.id = `itemCard_${index}`;

        let mainTitle = item.rawName;
        let mainAuthor = item.rawAuthor;
        let defaultSkuId = "";
        let defaultImgUrl = "";

        if (item.candidates && item.candidates.length > 0) {
          defaultSkuId = item.candidates[0].skuId;
          mainTitle = item.candidates[0].itemName;
          mainAuthor = item.candidates[0].author || mainAuthor;
          defaultImgUrl = item.candidates[0].imageUrl || "";
        }

        const imgHtml = defaultImgUrl
          ? `<img id="thumb_${index}" src="${defaultImgUrl}" class="item-thumb" alt="封面" onclick="window.open('${defaultImgUrl}', '_blank')">`
          : `<div id="thumb_${index}" class="item-thumb" style="display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:1.4rem;">📖</div>`;

        let candidatesHtml = '';
        if (item.candidates && item.candidates.length > 1) {
          candidatesHtml = `<div class="candidates-box"><small style="color:#b45309;font-weight:bold;">🔍 發現多筆相似物資，請點選眼前那一本：</small>`;
          item.candidates.forEach((cand, cIdx) => {
            const isChecked = cIdx === 0 ? 'checked' : '';
            const candImg = cand.imageUrl || '';
            candidatesHtml += `
              <label class="candidate-label">
                <input type="radio" name="skuChoice_${index}" value="${cand.skuId}" data-title="${cand.itemName}" data-img="${candImg}" ${isChecked} onchange="onCandidateChange(${index}, '${cand.skuId}', '${cand.itemName}', '${candImg}')">
                <span>${cand.itemName} (${cand.skuId})</span>
              </label>
            `;
          });
          candidatesHtml += `</div>`;
        } else if (item.candidates && item.candidates.length === 0) {
          candidatesHtml = `<div class="candidates-box" id="unmatchedNotice_${index}"><small style="color:#dc2626;">⚠️ 庫存主檔尚無此物資記錄</small></div>`;
        }

        itemCard.innerHTML = `
          <div class="item-header">
            <input type="checkbox" id="chk_${index}" checked onchange="toggleItemCheck(${index})">
            ${imgHtml}
            <div class="item-info">
              <div class="item-title" id="title_${index}">${mainTitle}</div>
              <div class="item-sub">${mainAuthor ? '✍️ ' + mainAuthor : ''} <span id="skuBadge_${index}" style="color:#0284c7; font-weight:bold;">${defaultSkuId ? '[' + defaultSkuId + ']' : ''}</span></div>
              
              <!-- 🌟 專屬微調與補拍快捷按鈕列 -->
              <div class="card-tools">
                <button type="button" class="tool-btn" onclick="openSearchModal(${index})">🔍 微調搜尋</button>
                <button type="button" class="tool-btn blue" onclick="triggerSingleCip(${index})">📖 補拍版權頁</button>
              </div>

              ${candidatesHtml}
            </div>
          </div>
          <div class="qty-section">
            <span style="font-size:0.85rem;font-weight:600;">實清數量：</span>
            <div class="qty-stepper">
              <button class="stepper-btn" onclick="changeQty(${index}, -1)">-</button>
              <input type="number" class="qty-input" id="qty_${index}" value="1" min="0" oninput="updateSubmitCount()">
              <button class="stepper-btn" onclick="changeQty(${index}, 1)">+</button>
            </div>
            <div class="quick-pills">
              <button class="pill" onclick="setQty(${index}, 1)">1</button>
              <button class="pill" onclick="setQty(${index}, 2)">2</button>
              <button class="pill" onclick="setQty(${index}, 5)">5</button>
              <button class="pill" onclick="setQty(${index}, 10)">10</button>
            </div>
          </div>
          <input type="hidden" id="selectedSkuId_${index}" value="${defaultSkuId}">
        `;

        container.appendChild(itemCard);
      });

      submitBtn.style.display = 'block';
      nextBtn.style.display = 'block';
      updateSubmitCount();
    }

    function onCandidateChange(itemIndex, skuId, itemName, imgUrl) {
      document.getElementById(`selectedSkuId_${itemIndex}`).value = skuId;
      document.getElementById(`title_${itemIndex}`).innerText = itemName;
      document.getElementById(`skuBadge_${itemIndex}`).innerText = `[${skuId}]`;
      updateCardThumbnail(itemIndex, imgUrl);
      updateSubmitCount();
    }

    function updateCardThumbnail(itemIndex, imgUrl) {
      const thumb = document.getElementById(`thumb_${itemIndex}`);
      if (!thumb) return;
      if (imgUrl) {
        if (thumb.tagName === 'IMG') {
          thumb.src = imgUrl;
        } else {
          const newImg = document.createElement('img');
          newImg.id = `thumb_${itemIndex}`;
          newImg.src = imgUrl;
          newImg.className = 'item-thumb';
          newImg.onclick = () => window.open(imgUrl, '_blank');
          thumb.parentNode.replaceChild(newImg, thumb);
        }
      }
    }

    // ==================== 🌟 專屬補拍版權頁邏輯 ====================
    function triggerSingleCip(index) {
      activeCardIndex = index;
      document.getElementById('cameraSingleCipFile').click();
    }

    document.getElementById('cameraSingleCipFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file || activeCardIndex === null) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box loading';
      statusBox.innerHTML = `⏳ 正在比對第 ${activeCardIndex + 1} 本物資的【版權頁 / CIP】，請稍候...`;

      compressAndConvertToBase64(file, (base64Data, mimeType) => {
        google.script.run
          .withSuccessHandler(res => {
            if (res.success && res.candidates && res.candidates.length > 0) {
              const bestMatch = res.candidates[0];
              onCandidateChange(activeCardIndex, bestMatch.skuId, bestMatch.itemName, bestMatch.imageUrl);
              
              const notice = document.getElementById(`unmatchedNotice_${activeCardIndex}`);
              if (notice) notice.style.display = 'none';

              statusBox.className = 'status-box success';
              statusBox.innerHTML = `🎉 成功透過版權頁比對出【${bestMatch.itemName}】！`;
            } else {
              statusBox.className = 'status-box error';
              statusBox.innerHTML = `⚠️ 版權頁辨識為《${res.itemName || '未知'}》，但主檔仍無對應紀錄。可點擊「微調搜尋」手動指定。`;
              if (res.itemName) {
                document.getElementById(`title_${activeCardIndex}`).innerText = res.itemName;
              }
            }
          })
          .withFailureHandler(err => {
            statusBox.className = 'status-box error';
            statusBox.innerHTML = `❌ 版權頁比對失敗: ${err.message || err}`;
          })
          .analyzeSingleCipPhoto(base64Data, mimeType);
      });
    });

    // ==================== 🌟 手動微調搜尋彈窗邏輯 ====================
    function openSearchModal(index) {
      activeCardIndex = index;
      const currentTitle = document.getElementById(`title_${index}`).innerText;
      document.getElementById('modalSearchInput').value = currentTitle;
      document.getElementById('modalSearchResult').innerHTML = '<p style="padding:10px; color:#64748b; font-size:0.85rem;">點擊上方「搜尋」開始比對...</p>';
      document.getElementById('searchModal').style.display = 'flex';
      executeModalSearch();
    }

    function closeSearchModal() {
      document.getElementById('searchModal').style.display = 'none';
      activeCardIndex = null;
    }

    function executeModalSearch() {
      const kw = document.getElementById('modalSearchInput').value.trim();
      const resultBox = document.getElementById('modalSearchResult');
      if (!kw) return;

      resultBox.innerHTML = '<p style="padding:10px; color:#0284c7; font-size:0.85rem;">⏳ 搜尋主檔中...</p>';

      google.script.run
        .withSuccessHandler(res => {
          if (!res.success || !res.candidates || res.candidates.length === 0) {
            resultBox.innerHTML = '<p style="padding:10px; color:#dc2626; font-size:0.85rem;">❌ 查無相符物資，請換關鍵字試試。</p>';
            return;
          }

          resultBox.innerHTML = '';
          res.candidates.forEach(cand => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'search-result-item';
            
            const thumbSrc = cand.imageUrl || '';
            const imgHtml = thumbSrc 
              ? `<img src="${thumbSrc}" style="width:36px; height:48px; object-fit:cover; border-radius:4px;">`
              : `<div style="width:36px; height:48px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:1rem; border-radius:4px;">📖</div>`;

            itemDiv.innerHTML = `
              ${imgHtml}
              <div style="flex:1;">
                <div style="font-weight:bold; font-size:0.88rem; color:#0f172a;">${cand.itemName}</div>
                <div style="font-size:0.75rem; color:#64748b;">${cand.author ? cand.author + ' ｜ ' : ''}${cand.skuId}</div>
              </div>
              <button class="tool-btn blue" style="font-size:0.75rem;">選取</button>
            `;

            itemDiv.onclick = () => {
              onCandidateChange(activeCardIndex, cand.skuId, cand.itemName, cand.imageUrl);
              const notice = document.getElementById(`unmatchedNotice_${activeCardIndex}`);
              if (notice) notice.style.display = 'none';
              closeSearchModal();
            };

            resultBox.appendChild(itemDiv);
          });
        })
        .withFailureHandler(err => {
          resultBox.innerHTML = `<p style="padding:10px; color:#dc2626; font-size:0.85rem;">連線錯誤: ${err.message}</p>`;
        })
        .searchSkuCandidates(kw);
    }

    function toggleItemCheck(index) {
      const chk = document.getElementById(`chk_${index}`);
      const card = document.getElementById(`itemCard_${index}`);
      if (chk.checked) {
        card.classList.add('checked');
      } else {
        card.classList.remove('checked');
      }
      updateSubmitCount();
    }

    function changeQty(index, delta) {
      const input = document.getElementById(`qty_${index}`);
      let val = parseInt(input.value, 10) || 0;
      val = Math.max(0, val + delta);
      input.value = val;
      updateSubmitCount();
    }

    function setQty(index, targetQty) {
      document.getElementById(`qty_${index}`).value = targetQty;
      updateSubmitCount();
    }

    function updateSubmitCount() {
      let count = 0;
      recognizedItemList.forEach((_, idx) => {
        const chk = document.getElementById(`chk_${idx}`);
        const sku = document.getElementById(`selectedSkuId_${idx}`);
        if (chk && chk.checked && sku && sku.value) count++;
      });
      const submitBtn = document.getElementById('batchSubmitBtn');
      submitBtn.innerText = `💾 確認並寫入庫存 (共 ${count} 件)`;
      submitBtn.disabled = (count === 0);
    }

    function submitBatchStocktake() {
      const toSubmit = [];
      recognizedItemList.forEach((_, idx) => {
        const chk = document.getElementById(`chk_${idx}`);
        if (chk && chk.checked) {
          const skuId = document.getElementById(`selectedSkuId_${idx}`).value;
          const itemName = document.getElementById(`title_${idx}`).innerText;
          const qty = parseInt(document.getElementById(`qty_${idx}`).value, 10) || 0;
          if (skuId) {
            toSubmit.push({ skuId: skuId, itemName: itemName, qty: qty });
          }
        }
      });

      if (toSubmit.length === 0) {
        alert("請確認至少勾選一項已對齊品項編號的物資！");
        return;
      }

      const submitBtn = document.getElementById('batchSubmitBtn');
      const statusBox = document.getElementById('statusBox');
      submitBtn.disabled = true;
      submitBtn.innerText = '⏳ 正在寫入試算表庫存...';

      google.script.run
        .withSuccessHandler(res => {
          submitBtn.disabled = false;
          if (res.success) {
            statusBox.className = 'status-box success';
            statusBox.innerHTML = `🎉 <b>成功完成 ${toSubmit.length} 筆物資盤點！</b><br>庫存已同步更新。您可直接拍攝本格下一批物資，或點擊右上角關閉視窗回到 LINE。`;
            document.getElementById('itemsContainer').innerHTML = '';
            submitBtn.style.display = 'none';
            document.getElementById('previewImg').style.display = 'none';
          } else {
            statusBox.className = 'status-box error';
            statusBox.innerHTML = `❌ 寫入失敗：${res.message}`;
          }
        })
        .withFailureHandler(err => {
          submitBtn.disabled = false;
          statusBox.className = 'status-box error';
          statusBox.innerHTML = `❌ 連線異常：${err.message || err}`;
        })
        .batchUpdateStock(CELL_CODE, USER_ID, toSubmit);
    }

    function continueNextBatch() {
      document.getElementById('itemsContainer').innerHTML = '';
      document.getElementById('batchSubmitBtn').style.display = 'none';
      document.getElementById('btnContinueNext').style.display = 'none';
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('statusBox').style.display = 'none';
      document.getElementById('cameraStocktakeFile').click();
    }

    function handleVisionError(err) {
      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'status-box error';
      statusBox.innerHTML = `❌ AI 辨識異常：${err.message || err}`;
    }

    function compressAndConvertToBase64(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxWidth = 900;
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.65).split(',')[1], 'image/jpeg');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
